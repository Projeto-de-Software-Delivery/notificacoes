name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:

env:
  IMAGEM: servico-notificacoes

jobs:
  # 1. Sobe Redis + RabbitMQ de verdade e confere que o serviço fala com os dois.
  smoke:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-secret' }}
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      # Sem GOOGLE_APPLICATION_CREDENTIALS o push roda em modo log — é o que queremos no CI.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Testes unitários (>= 80% de cobertura)
        run: npm run test:coverage

      - name: Sobe o serviço
        run: |
          node src/index.js > app.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/health && break
            sleep 1
          done

      - name: Health check
        run: curl -sf http://localhost:8080/health | grep -q '"status":"UP"'

      - name: Consumer conectou no RabbitMQ
        run: grep -q "\[amqp\] consumindo" app.log

      - name: Dispara um evento pelo dispatcher
        run: |
          curl -sf -X POST http://localhost:8080/dev/eventos/pedido.validado \
            -H 'Content-Type: application/json' \
            -d '{"pedido_id":1,"cliente_id":42,"loja_id":7}'
          sleep 1
          cat app.log

  # 2. Publica a imagem no Docker Hub.
  imagem:
    needs: smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O driver padrão (docker) não exporta cache type=gha; o buildx cria um builder docker-container.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGEM }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Entra na VM por SSH e sobe a imagem nova.
  deploy:
    needs: imagem
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      PASTA: ~/servico-notificacoes
      USUARIO: ${{ vars.SSH_USER || 'ubuntu' }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepara a chave SSH
        env:
          KEY_TEST: ${{ secrets.KEY_TEST }}
          HOST_TEST: ${{ secrets.HOST_TEST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY_TEST" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          [ -n "$HOST_TEST" ] || { echo "::error::secret HOST_TEST vazio ou inexistente"; exit 1; }
          [ -n "$KEY_TEST" ]  || { echo "::error::secret KEY_TEST vazio ou inexistente"; exit 1; }
          case "$HOST_TEST" in
            *BEGIN*|-*|*$'\n'*) echo "::error::HOST_TEST não parece um IP/hostname (tem a chave privada aí?)"; exit 1 ;;
          esac
          for _ in 1 2 3; do
            ssh-keyscan -T 10 -H "$HOST_TEST" >> ~/.ssh/known_hosts && exit 0
            sleep 5
          done
          echo "::error::não consegui falar com $HOST_TEST na porta 22 (VM desligada, IP errado ou firewall bloqueando o GitHub Actions)"
          exit 1

      - name: Monta o .env e a service account do Firebase
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          mkdir -p entrega
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > entrega/firebase.json
          cat > entrega/.env <<ENV
          PORT=8080
          JWT_SECRET=$JWT_SECRET
          REDIS_URL=$REDIS_URL
          RABBITMQ_URL=$RABBITMQ_URL
          RABBITMQ_EXCHANGE=pedidos
          RABBITMQ_QUEUE=notificacoes.pedidos
          ENV

      - name: Copia para a VM
        env:
          HOST_TEST: ${{ secrets.HOST_TEST }}
        run: |
          ssh -i ~/.ssh/deploy "$USUARIO@$HOST_TEST" "mkdir -p $PASTA"
          scp -i ~/.ssh/deploy entrega/.env entrega/firebase.json \
            "$USUARIO@$HOST_TEST:$PASTA/"

      - name: Sobe a versão nova
        env:
          HOST_TEST: ${{ secrets.HOST_TEST }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        # Tudo na rede-delivery. Os aliases (notificacoes, redis, rabbitmq) são os nomes
        # que os outros containers usam: notificacoes:8080, redis:6379, rabbitmq:5672.
        # O heredoc não tem aspas: os $ são expandidos aqui no runner, e o \$PWD na VM.
        run: |
          ssh -i ~/.ssh/deploy "$USUARIO@$HOST_TEST" bash -s <<REMOTO
            set -e
            cd $PASTA
            chmod 600 .env firebase.json
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker network inspect rede-delivery >/dev/null 2>&1 || docker network create rede-delivery

            # Containers antigos do docker compose (só existem na primeira vez).
            docker rm -f servico-notificacoes-notificacoes-1 servico-notificacoes-redis-1 servico-notificacoes-rabbitmq-1 2>/dev/null || true
            docker network rm servico-notificacoes_default 2>/dev/null || true

            # Redis e RabbitMQ: só cria se ainda não existem (não perde fila nem device_tokens a cada deploy).
            docker inspect notificacoes-redis >/dev/null 2>&1 || docker run -d \
              --name notificacoes-redis \
              --network rede-delivery --network-alias redis \
              -v notificacoes-redis-data:/data \
              --restart unless-stopped \
              redis:7-alpine

            docker inspect notificacoes-rabbitmq >/dev/null 2>&1 || docker run -d \
              --name notificacoes-rabbitmq --hostname notificacoes-rabbitmq \
              --network rede-delivery --network-alias rabbitmq \
              -p 15672:15672 \
              -v notificacoes-rabbitmq-data:/var/lib/rabbitmq \
              --restart unless-stopped \
              rabbitmq:3-management-alpine

            # O serviço: sempre troca pela imagem nova. Escuta na 8080, a VM expõe na 8082.
            docker pull $DOCKERHUB_USERNAME/$IMAGEM:${{ github.sha }}
            docker rm -f servico-notificacoes 2>/dev/null || true
            docker run -d \
              --name servico-notificacoes \
              --network rede-delivery --network-alias notificacoes \
              -p 8082:8080 \
              --env-file .env \
              -e NODE_ENV=production \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/firebase.json \
              -v "\$PWD/firebase.json:/app/firebase.json:ro" \
              --restart unless-stopped \
              $DOCKERHUB_USERNAME/$IMAGEM:${{ github.sha }}

            docker image prune -af
            docker ps --filter name=notificacoes
          REMOTO
