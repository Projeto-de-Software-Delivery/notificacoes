# Usado só na VM. A imagem vem pronta do Docker Hub (o código não fica lá).
# O IMAGE e as credenciais chegam pelo .env que o workflow escreve.
services:
  notificacoes:
    image: ${IMAGE}
    ports: ["3004:3004"]
    env_file: .env
    environment:
      NODE_ENV: production   # desliga o /dev/eventos
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase.json
    volumes: ["./firebase.json:/app/firebase.json:ro"]
    depends_on: [redis, rabbitmq]
    restart: unless-stopped

  # Se o REDIS_URL/RABBITMQ_URL apontarem para serviço gerenciado,
  # pode apagar os dois blocos abaixo.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["15672:15672"]   # painel; tire daqui se não quiser expor
    restart: unless-stopped
