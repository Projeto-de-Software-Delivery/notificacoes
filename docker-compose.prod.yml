# Usado só na VM. A imagem vem pronta do Docker Hub (o código não fica lá).
# O IMAGE e as credenciais chegam pelo .env que o workflow escreve.
services:
  notificacoes:
    image: ${IMAGE}
    ports: ["8082:8080"]   # 8082 na VM (liberada no security group) -> 8080 no container (PORT=8080 no .env)
    env_file: .env
    environment:
      NODE_ENV: production   # desliga o /dev/eventos
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase.json
    volumes: ["./firebase.json:/app/firebase.json:ro"]
    depends_on: [redis, rabbitmq]
    restart: unless-stopped
    # default: fala com redis/rabbitmq; rede-delivery: os outros serviços acham ele como notificacoes:8080
    networks: [default, rede-delivery]

  # Se o REDIS_URL/RABBITMQ_URL apontarem para serviço gerenciado,
  # pode apagar os dois blocos abaixo.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [default, rede-delivery]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports: ["15672:15672"]   # painel; tire daqui se não quiser expor
    restart: unless-stopped
    # rede-delivery: o serviço de delivery publica os eventos em amqp://guest:guest@rabbitmq:5672
    networks: [default, rede-delivery]

networks:
  rede-delivery:
    external: true   # já existe na VM (docker network create rede-delivery)
